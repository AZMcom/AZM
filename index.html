<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>多板1站</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: system-ui, sans-serif;
            overflow: hidden;
        }
        /* 左侧导航栏改为红粉渐变 */
        .sidebar {
            background: linear-gradient(180deg, #e64960, #f472b6);
            height: 100vh;
            min-width: 180px;
            padding-top:20px;
        }
        /* 头像区域 */
        .avatar-box{
            text-align:center;
            padding:12px 10px 20px;
            border-bottom:1px solid rgba(255,255,255,0.2);
            margin-bottom:16px;
        }
        .avatar-img{
            width:80px;
            height:80px;
            border-radius:50%;
            object-fit:cover;
            border:3px solid #ffffff77;
        }
        .avatar-name{
            color:#fff;
            margin-top:8px;
            font-size:16px;
        }
        .sidebar a{
            display:block;
            color:#fff;
            padding:14px 24px;
            text-decoration: none;
            transition:0.25s;
            cursor:pointer;
        }
        .sidebar a:hover{
            background:rgba(255,255,255,0.2);
        }
        .sidebar a.active{
            background:rgba(255,255,255,0.28);
        }
        /* 页面容器 */
        .page-container{
            flex:1;
            height:100vh;
            overflow:auto;
        }
        .page{
            min-height:100%;
            display:none;
        }
        .page.show{
            display:block;
        }
        /* 主页大图背景 */
        .home-page{
            background: url("https://picsum.photos/id/1036/1920/1080") center / cover no-repeat;
            color:white;
            padding:80px 60px;
        }
        /* 板块页面背景：柔和暖米色，不刺眼 */
        .block-page{
            padding:48px 40px;
            background:#fff3e8;
        }
        .card-wrap{
            display:grid;
            grid-template-columns: repeat(auto-fill, minmax(280px,1fr));
            gap:24px;
            margin-top:32px;
        }
        .card-item{
            height:220px;
            border-radius:12px;
            position:relative;
            overflow:hidden;
        }
        .card-item a{
            width:100%;
            height:100%;
            display:flex;
            align-items:center;
            justify-content:center;
            color:white;
            font-size:18px;
            font-weight:500;
            text-decoration:none;
            background:rgba(0,0,0,0.35);
        }
        .card-item a:hover{
            background:rgba(0,0,0,0.5);
        }
        /* 右下角可拖动备注框 */
        .drag-box{
            width:240px;
            height:160px;
            background:rgba(255,255,255,0.92);
            border:1px solid #bbb;
            border-radius:8px;
            position:fixed;
            bottom:20px;
            right:20px;
            z-index:99;
            cursor:move;
            box-shadow: 0 4px 14px #00000026;
        }
        .drag-box-header{
            background:#cbd5e1;
            padding:6px 10px;
            font-size:13px;
        }
        .drag-box textarea{
            width:100%;
            height:calc(100% - 28px);
            border:none;
            resize:none;
            padding:8px;
            background:transparent;
        }
    </style>
</head>
<body class="flex">
    <!-- 左侧导航栏 -->
    <div class="sidebar">
        <!-- 头像+姓名区域 -->
        <div class="avatar-box">
            <img class="avatar-img" src="https://picsum.photos/id/1005/120/120" alt="头像">
            <div class="avatar-name">张三</div>
        </div>

        <a data-target="home" class="active">主页</a>
        <a data-target="block1">版块1</a>
        <a data-target="block2">版块2</a>
        <a data-target="block3">版块3</a>
        <a data-target="block4">版块4</a>
    </div>

    <div class="page-container">
        <!-- 主页 -->
        <div id="home" class="page show home-page">
            <h1 class="text-5xl font-bold mb-6">主标题</h1>
            <p class="max-w-xl text-lg leading-relaxed">
                这里写主页描述文字，介绍网站整体简介。
                页面背景是大图图片，文字叠加在图片上面。
            </p>
        </div>

        <!-- 版块1 -->
        <div id="block1" class="page block-page">
            <h2 class="text-4xl font-bold text-slate-800">版块1主标题</h2>
            <div class="card-wrap">
                <div class="card-item" style="background:url('https://picsum.photos/id/1018/600/400') center/cover">
                    <!-- href填写目标网页地址，target="_blank"在新标签页打开 -->
                    <a href="https://www.baidu.com" target="_blank">标题：超链接</a>
                </div>
                <div class="card-item" style="background:url('https://picsum.photos/id/1019/600/400') center/cover">
                    <a href="https://www.baidu.com" target="_blank">标题：超链接</a>
                </div>
                <div class="card-item" style="background:url('https://picsum.photos/id/1022/600/400') center/cover">
                    <a href="https://www.baidu.com" target="_blank">标题：超链接</a>
                </div>
            </div>
        </div>

        <!-- 版块2 -->
        <div id="block2" class="page block-page">
            <h2 class="text-4xl font-bold text-slate-800">版块2主标题</h2>
            <div class="card-wrap">
                <div class="card-item" style="background:url('https://picsum.photos/id/1025/600/400') center/cover">
                    <a href="https://www.baidu.com" target="_blank">标题：超链接</a>
                </div>
                <div class="card-item" style="background:url('https://picsum.photos/id/1027/600/400') center/cover">
                    <a href="https://www.baidu.com" target="_blank">标题：超链接</a>
                </div>
            </div>
        </div>

        <!-- 版块3 -->
        <div id="block3" class="page block-page">
            <h2 class="text-4xl font-bold text-slate-800">版块3主标题</h2>
            <div class="card-wrap">
                <div class="card-item" style="background:url('https://picsum.photos/id/1031/600/400') center/cover">
                    <a href="https://www.baidu.com" target="_blank">标题：超链接</a>
                </div>
            </div>
        </div>

        <!-- 版块4 -->
        <div id="block4" class="page block-page">
            <h2 class="text-4xl font-bold text-slate-800">版块4主标题</h2>
            <div class="card-wrap">
                <div class="card-item" style="background:url('https://picsum.photos/id/1033/600/400') center/cover">
                    <a href="https://www.baidu.com" target="_blank">标题：超链接</a>
                </div>
            </div>
        </div>
    </div>

    <!-- 右下角可拖动备注框 -->
    <div class="drag-box" id="dragBox">
        <div class="drag-box-header">可拖动备注框（拖动顶部）</div>
        <textarea placeholder="填写备注内容..."></textarea>
    </div>

    <script>
        //页面切换
        const navLinks = document.querySelectorAll(".sidebar a");
        const pages = document.querySelectorAll(".page");
        navLinks.forEach(link=>{
            link.onclick = ()=>{
                const targetId = link.dataset.target;
                navLinks.forEach(l=>l.classList.remove("active"));
                link.classList.add("active");
                pages.forEach(p=>p.classList.remove("show"));
                document.getElementById(targetId).classList.add("show");
            }
        })

        //拖拽悬浮框
        const dragBox = document.getElementById("dragBox");
        const header = dragBox.querySelector(".drag-box-header");
        let isDrag = false,dx,dy;
        header.addEventListener('mousedown',e=>{
            isDrag=true;
            dx = e.clientX - dragBox.offsetLeft;
            dy = e.clientY - dragBox.offsetTop;
        })
        document.addEventListener('mousemove',e=>{
            if(!isDrag) return;
            dragBox.style.left = (e.clientX - dx)+"px";
            dragBox.style.top = (e.clientY - dy)+"px";
            dragBox.style.right = "auto";
            dragBox.style.bottom = "auto";
        })
        document.addEventListener('mouseup',()=>isDrag=false)
    </script>
</body>
</html>
